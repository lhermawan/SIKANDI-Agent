agent:
  heartbeat_interval: 60
  metrics_interval: 60
  security_interval: 10
api:
  timeout: 10
  token: ""
  url: https://sikandi.ciamiskab.go.id/api/v1/agent
queue:
  enabled: true
  max_size: 10000
security:
  brute_force:
    enabled: true
    threshold: 5
    window_seconds: 300
  enabled: true
  file_integrity:
    enabled: true
  network_monitoring:
    enabled: true
  persistence:
    enabled: true
  process_monitoring:
    enabled: true
  suspicious_login:
    enabled: true
